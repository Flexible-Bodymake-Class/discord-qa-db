<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FBCサロン Q&A 検索</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
    "Noto Sans JP", sans-serif;
  background: #faf9f7;
  color: #333;
  line-height: 1.6;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 16px;
}

.header {
  text-align: center;
  padding: 32px 0 24px;
}
.header h1 {
  font-size: 1.5rem;
  color: #e67e22;
  margin-bottom: 8px;
}
.header p {
  color: #888;
  font-size: 0.9rem;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 12px;
  font-size: 0.85rem;
}
.stats span {
  background: #fff;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid #eee;
}

.search-box {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #faf9f7;
  padding: 12px 0;
}
.search-input {
  width: 100%;
  padding: 14px 20px;
  font-size: 1rem;
  border: 2px solid #e0ddd8;
  border-radius: 12px;
  outline: none;
  background: #fff;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: #e67e22; }
.search-input::placeholder { color: #bbb; }

.tag-section {
  padding: 8px 0 16px;
}
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.tag-btn {
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid #ddd;
  background: #fff;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  color: #666;
}
.tag-btn:hover { border-color: #e67e22; color: #e67e22; }
.tag-btn.active { background: #e67e22; border-color: #e67e22; color: #fff; }
.tag-btn .count { font-size: 0.7rem; opacity: 0.7; margin-left: 2px; }

.results-info {
  font-size: 0.85rem;
  color: #999;
  margin-bottom: 12px;
}

.qa-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #eee;
  transition: box-shadow 0.2s;
}
.qa-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

.qa-question {
  font-weight: 600;
  font-size: 0.95rem;
  margin-bottom: 8px;
  color: #333;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.qa-question-text {
  white-space: pre-wrap;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.qa-question-text.expanded {
  display: block;
  overflow: visible;
}
.expand-btn {
  font-size: 0.75rem;
  color: #e67e22;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 0 0;
  font-weight: 500;
  display: none;
}
.qa-question::before {
  content: "Q";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: #e67e22;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  flex-shrink: 0;
}

.qa-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 0.8rem;
  color: #999;
}
.qa-meta .author { color: #666; }

.qa-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.qa-tag {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  color: #fff;
  font-weight: 500;
}

.qa-answer-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid #e0ddd8;
  background: #faf9f7;
  font-size: 0.8rem;
  color: #666;
  cursor: pointer;
  transition: all 0.15s;
}
.qa-answer-toggle:hover { background: #f0eeea; }
.qa-answer-toggle .arrow { transition: transform 0.2s; font-size: 0.7rem; }
.qa-answer-toggle.open .arrow { transform: rotate(90deg); }

.qa-answer {
  display: none;
  margin-top: 12px;
  padding: 14px;
  background: #faf9f7;
  border-radius: 8px;
  font-size: 0.9rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
  border-left: 3px solid #e67e22;
}
.qa-answer.show { display: block; }

.qa-answer-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #e67e22;
  margin-bottom: 8px;
}
.qa-answer-label::before {
  content: "A";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  border-radius: 5px;
  background: #27ae60;
  color: #fff;
  font-size: 0.7rem;
}

.discord-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  color: #7289da;
  text-decoration: none;
  margin-top: 8px;
}
.discord-link:hover { text-decoration: underline; }

mark {
  background: #ffeaa7;
  color: inherit;
  padding: 0 2px;
  border-radius: 2px;
}

.loading-state, .empty-state, .error-state {
  text-align: center;
  padding: 48px 16px;
  color: #ccc;
}
.loading-state .icon, .empty-state .icon, .error-state .icon {
  font-size: 3rem;
  margin-bottom: 12px;
}
.error-state { color: #e74c3c; }

.footer {
  text-align: center;
  padding: 32px 16px;
  margin-top: 24px;
  border-top: 1px solid #eee;
}
.footer a {
  display: inline-block;
  padding: 12px 24px;
  background: #7289da;
  color: #fff;
  text-decoration: none;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 600;
  transition: opacity 0.2s;
}
.footer a:hover { opacity: 0.9; }
.footer p { margin-top: 8px; font-size: 0.8rem; color: #999; }

@media (max-width: 480px) {
  .header h1 { font-size: 1.3rem; }
  .qa-card { padding: 14px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>FBCサロン Q&A 検索</h1>
    <p>過去のQ&amp;Aから、あなたの悩みのヒントが見つかるかも！</p>
    <div class="stats" id="stats">
      <span>読み込み中...</span>
    </div>
  </div>

  <div class="search-box">
    <input type="text" class="search-input" id="searchInput"
      placeholder="🔍 キーワードで検索（例：股関節 痛み）" autocomplete="off">
  </div>

  <div class="tag-section">
    <div class="tag-row" id="categoryTags"></div>
  </div>

  <div class="results-info" id="resultsInfo"></div>
  <div id="results">
    <div class="loading-state">
      <div class="icon">⏳</div>
      <p>Q&amp;Aを読み込んでいます...</p>
    </div>
  </div>

  <div class="footer">
    <a href="https://discord.com/channels/1441619538293686387/1444479247669530664"
       target="_blank" rel="noopener">
      💬 質問部屋で新しい質問をする
    </a>
    <p>見つからない場合はDiscordで直接質問してください</p>
  </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRwau-zsJARk32FBYH9chZb00elQRkW9B8P0PyWCyfGmGQ59XT9rZ7GJedNbGIS3ermcNW5bOut2r2J/pub?gid=0&single=true&output=csv";

const COL = { hidden: 0, question: 1, answer: 2, author: 3, answerAuthors: 4, date: 5, url: 6, replyCount: 7 };

const TAG_RULES = {
  '股関節':'股関節','膝':'膝','足首':'足首','アーカイブ':'アーカイブ',
  'お尻':'お尻','臀筋':'お尻','腰':'腰','肩':'肩','肩甲骨':'肩',
  '背中':'背中','肋骨':'肋骨','前もも':'前もも','前腿':'前もも',
  '内もも':'内もも','内転筋':'内もも','腸腰筋':'腸腰筋','骨盤':'骨盤',
  '胸椎':'背中','脛':'脛','ふくらはぎ':'ふくらはぎ','首':'首',
  'ストレッチ':'ストレッチ','開脚':'開脚','ヨガ':'ヨガ','ダウンドッグ':'ヨガ',
  'スワン':'スワン','ピジョン':'ピジョン','トレーニング':'トレーニング',
  '筋トレ':'トレーニング','リリース':'リリース','筋膜':'リリース',
  '痛み':'痛み','痛い':'痛み','痛く':'痛み',
  '硬い':'柔軟性','硬さ':'柔軟性','柔軟':'柔軟性','可動域':'柔軟性',
  '姿勢':'姿勢','猫背':'姿勢','反り腰':'姿勢',
  'X脚':'脚の形','O脚':'脚の形'
};

const TAG_COLORS = {
  '股関節':'#e74c3c','膝':'#e67e22','足首':'#f39c12','アーカイブ':'#8e44ad',
  'お尻':'#d35400','腰':'#c0392b','肩':'#2980b9','背中':'#3498db',
  '肋骨':'#1abc9c','前もも':'#e74c3c','内もも':'#e74c3c','腸腰筋':'#9b59b6',
  '骨盤':'#8e44ad','脛':'#f39c12','ふくらはぎ':'#e67e22','首':'#2980b9',
  'ストレッチ':'#27ae60','開脚':'#2ecc71','ヨガ':'#16a085','トレーニング':'#2c3e50',
  'リリース':'#1abc9c','スワン':'#16a085','ピジョン':'#1abc9c',
  '痛み':'#e74c3c','柔軟性':'#3498db','姿勢':'#9b59b6','脚の形':'#e67e22'
};

let QA_DATA = [];
let activeTags = new Set();
let searchQuery = "";

// Robust CSV parser that handles quoted fields with embedded newlines and commas
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
  }
  if (field || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function autoTag(question, answer) {
  const text = question + ' ' + answer;
  const tags = new Set();
  for (const [kw, tag] of Object.entries(TAG_RULES)) {
    if (text.includes(kw)) tags.add(tag);
  }
  return [...tags].sort();
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = parseCSV(await res.text());

    QA_DATA = rows.slice(1)
      .filter(r => r.length > COL.answer && r[COL.hidden].toUpperCase() !== 'TRUE')
      .map(r => ({
        question: r[COL.question] || '',
        answer:   r[COL.answer]   || '',
        author:   r[COL.author]   || '',
        date:     r[COL.date]     || '',
        url:      r[COL.url]      || '',
        tags:     autoTag(r[COL.question] || '', r[COL.answer] || '')
      }))
      .filter(qa => qa.question && qa.answer);

    document.getElementById('stats').innerHTML =
      `<span>✅ 回答済み ${QA_DATA.length} 件</span>`;

    renderTags();
    renderResults();

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      renderResults();
    });
  } catch (e) {
    document.getElementById('results').innerHTML = `
      <div class="error-state">
        <div class="icon">⚠️</div>
        <p>データの読み込みに失敗しました</p>
        <p style="font-size:0.8rem;margin-top:8px">${e.message}</p>
      </div>`;
  }
}

function renderTags() {
  const tagCounts = {};
  QA_DATA.forEach(qa => qa.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const sorted = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).map(e => e[0]);

  document.getElementById('categoryTags').innerHTML = sorted.map(tag => `
    <button class="tag-btn ${activeTags.has(tag) ? 'active' : ''}" data-tag="${tag}" onclick="toggleTag('${tag}')">
      ${tag} <span class="count">${tagCounts[tag]}</span>
    </button>`).join('');
}

function toggleTag(tag) {
  activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.classList.toggle('active', activeTags.has(btn.dataset.tag));
  });
  renderResults();
}

function filterQA() {
  let results = [...QA_DATA].sort((a, b) => b.date.localeCompare(a.date));
  if (activeTags.size > 0) {
    results = results.filter(qa => [...activeTags].every(t => qa.tags.includes(t)));
  }
  if (searchQuery) {
    const kws = searchQuery.split(/\s+/).filter(k => k.length > 0);
    results = results.filter(qa => {
      const text = (qa.question + ' ' + qa.answer).toLowerCase();
      return kws.every(kw => text.includes(kw.toLowerCase()));
    });
  }
  return results;
}

function renderResults() {
  const filtered = filterQA();
  document.getElementById('resultsInfo').textContent =
    (searchQuery || activeTags.size > 0)
      ? `${filtered.length} 件見つかりました`
      : `全 ${QA_DATA.length} 件のQ&A`;

  if (filtered.length === 0) {
    document.getElementById('results').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>該当するQ&Aが見つかりませんでした</p>
        <p style="margin-top:8px;font-size:0.85rem">キーワードを変えるか、質問部屋で直接質問してください</p>
      </div>`;
    return;
  }

  document.getElementById('results').innerHTML = filtered.map((qa, i) => {
    const tagHtml = qa.tags.map(tag =>
      `<span class="qa-tag" style="background:${TAG_COLORS[tag] || '#999'}">${tag}</span>`
    ).join('');

    return `
      <div class="qa-card">
        <div class="qa-question">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span class="qa-question-text" id="qt-${i}">${highlight(qa.question)}</span>
            <button class="expand-btn" id="eb-${i}" onclick="toggleExpand(${i})">もっと見る ▼</button>
          </div>
        </div>
        <div class="qa-tags">${tagHtml}</div>
        <div class="qa-meta">
          <span class="author">👤 ${esc(qa.author)}</span>
          <span>📅 ${qa.date}</span>
        </div>
        <button class="qa-answer-toggle" onclick="toggleAnswer(this)">
          <span class="arrow">▶</span> 回答を見る
        </button>
        <div class="qa-answer">
          <div class="qa-answer-label">回答</div>
          ${esc(qa.answer)}
        </div>
        ${qa.url ? `<a class="discord-link" href="${qa.url}" target="_blank" rel="noopener">🔗 Discordで見る</a>` : ''}
      </div>`;
  }).join('');

  setTimeout(() => {
    filtered.forEach((_, i) => {
      const el = document.getElementById('qt-' + i);
      const btn = document.getElementById('eb-' + i);
      if (el && btn && el.scrollHeight > el.clientHeight + 2) {
        btn.style.display = 'block';
      }
    });
  }, 0);
}

function toggleExpand(i) {
  const el = document.getElementById('qt-' + i);
  const btn = document.getElementById('eb-' + i);
  const expanded = el.classList.toggle('expanded');
  btn.textContent = expanded ? '閉じる ▲' : 'もっと見る ▼';
}

function toggleAnswer(btn) {
  const answer = btn.nextElementSibling;
  const isOpen = answer.classList.toggle('show');
  btn.classList.toggle('open', isOpen);
  btn.innerHTML = isOpen
    ? '<span class="arrow">▶</span> 回答を閉じる'
    : '<span class="arrow">▶</span> 回答を見る';
}

function highlight(text) {
  if (!searchQuery) return esc(text);
  const kws = searchQuery.split(/\s+/).filter(k => k.length > 0);
  let result = esc(text);
  kws.forEach(kw => {
    const re = new RegExp('(' + escRe(esc(kw)) + ')', 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  });
  return result;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

loadData();
</script>
</body>
</html>
